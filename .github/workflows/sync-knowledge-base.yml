name: Synchronize Portfolio Knowledge Base

on:
  push:
    branches:
      - main
    paths:
      - 'images/*.pdf'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  sync-knowledge-base:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Incremental Knowledge Base Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          EMBEDDING_DIMENSION: ${{ secrets.EMBEDDING_DIMENSION || '768' }}
        run: |
          python scripts/ingest.py --incremental --commit ${{ github.sha }}
